<body>
  <section class="hero"><div class="brand">TODAY WHAT BEACH?</div><div class="mascot" aria-label="귀여운 바다 친구">🐳</div><h1>오늘뭐해변?</h1><p>전국 해수욕장 정보와 활동별 추천</p></section>
  <main class="wrap"><nav class="mode-tabs"><button id="activityTab" class="active">활동으로 찾기</button><button id="beachTab">바다로 보기</button></nav><section id="activityMode"><h3>무엇을 하고 싶나요?</h3><div class="chips" id="chips"></div><section class="recommend"><div class="recommend-main"><b id="recommendLabel"></b><h2 id="recommendName"></h2><p id="recommendInfo"></p></div><button id="miniMapButton" class="map-preview" type="button" aria-label="선택 해수욕장 지도 크게 보기"><div id="miniMap"></div><span>지도를 크게 보기</span></button></section><h2>추천 해수욕장</h2><div id="list"></div></section><section id="beachMode" class="hidden"><h3>궁금한 바다를 선택하세요</h3><p class="meta">현재 바다 정보와 즐길 수 있는 활동을 한눈에 확인해요.</p><div class="beach-picker" id="beachPicker"></div><div id="beachDetail"></div></section></main><div id="mapModal" class="map-modal hidden" aria-hidden="true"><section class="map-dialog" role="dialog" aria-modal="true" aria-labelledby="mapTitle"><div class="map-dialog-head"><h2 id="mapTitle">해수욕장 지도</h2><button id="closeMap" class="map-close" type="button">닫기 ✕</button></div><div id="fullMap" class="full-map"></div><div class="route-actions"><button id="showMyLocation" type="button">◎ 내 위치 표시</button><a id="kakaoRoute" href="#" target="_blank" rel="noopener">카카오맵 길찾기 ↗</a><p id="routeStatus">지도를 누르면 크게 볼 수 있어요.</p></div></section></div>
  <script>
    const activities=['물놀이','서핑','스노클링','갯벌체험','비치발리볼','모래놀이','휴식'];
    const beaches=[
      {name:'해운대해수욕장',wave:.5,temp:25.8,period:5.2,wind:3.1,windDir:'남동',tide:'만조 14:22',water:'좋음',jelly:'관찰 없음',sand:31,scores:[95,58,75,45,94,90,88],photo:'https://commons.wikimedia.org/wiki/Special:FilePath/Busan%20City%20Haeundae%20Beach%20KOGL%20(01).jpg?width=700'},
      {name:'광안리해수욕장',wave:.4,temp:26.1,period:4.8,wind:2.5,windDir:'동',tide:'만조 14:18',water:'좋음',jelly:'관찰 없음',sand:32,scores:[93,51,67,42,96,94,92],photo:'https://commons.wikimedia.org/wiki/Special:FilePath/Gwangalli%20Beach.jpg?width=700'},
      {name:'송정해수욕장',wave:1.1,temp:25.3,period:7.4,wind:5.8,windDir:'동남동',tide:'만조 14:31',water:'매우 좋음',jelly:'주의',sand:30,scores:[68,98,78,39,76,72,73],photo:'https://commons.wikimedia.org/wiki/Special:FilePath/Songjeong%20Beach.jpg?width=700'},
      {name:'다대포해수욕장',wave:.7,temp:25.5,period:6.1,wind:4.0,windDir:'남',tide:'간조 18:05',water:'좋음',jelly:'관찰 없음',sand:29,scores:[84,72,63,97,86,88,91],photo:'https://commons.wikimedia.org/wiki/Special:FilePath/Dadaepo%20Beach,%20Busan,%20Korea.jpg?width=700'},
      {name:'일광해수욕장',wave:.6,temp:25.1,period:5.5,wind:3.6,windDir:'남동',tide:'간조 18:12',water:'매우 좋음',jelly:'관찰 없음',sand:30,scores:[90,61,91,82,78,96,89],photo:'https://commons.wikimedia.org/wiki/Special:FilePath/일광해수욕장.jpg?width=700'},
      {name:'임랑해수욕장',wave:.8,temp:24.9,period:6.6,wind:4.4,windDir:'동남동',tide:'간조 18:17',water:'매우 좋음',jelly:'관찰 없음',sand:28,scores:[85,77,94,76,70,88,95],photo:'https://commons.wikimedia.org/wiki/Special:FilePath/Busan%20beach.jpg?width=700'},
      {name:'송도해수욕장',wave:.4,temp:25.7,period:4.9,wind:2.8,windDir:'남동',tide:'만조 14:25',water:'좋음',jelly:'관찰 없음',sand:30,scores:[92,48,86,55,84,91,93],photo:'https://commons.wikimedia.org/wiki/Special:FilePath/Seongdo%20Beach.jpg?width=700'}
    ];
    let selected=0;
    let selectedBeach=0;
    let chosenBeachName=null;
    const liveNotice=document.createElement('div');
    liveNotice.style.cssText='background:#e2f7f3;border-radius:13px;padding:11px 13px;margin:16px 0;color:#16776e;font-size:12px;font-weight:700';
    liveNotice.textContent='기상청 해양관측 자료를 불러오는 중입니다.';
    document.querySelector('.wrap').prepend(liveNotice);
    const refreshButton=document.createElement('button');
    refreshButton.textContent='↻ 지금 새로고침';
    refreshButton.style.cssText='display:block;margin:0 0 16px auto;border:0;background:#087f8b;color:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer';
    document.querySelector('.wrap').insertBefore(refreshButton,document.querySelector('.mode-tabs'));
    const seaLayer=document.createElement('div');
    seaLayer.className='sea-creatures';
    const seaKinds=['fish','puffer','jelly','octo','star','fish','jelly','puffer','octo','star','fish','jelly'];
    seaLayer.innerHTML=seaKinds.map((kind,i)=>{const left=3+Math.random()*88;const top=3+Math.random()*88;const dx=(Math.random()>.5?1:-1)*(8+Math.random()*20);const dy=(Math.random()>.5?1:-1)*(5+Math.random()*18);return `<span class="creature ${kind}" style="left:${left}%;top:${top}%;--dx:${dx}vw;--dy:${dy}vh;--d:${11+Math.random()*10}s;--delay:-${Math.random()*10}s"></span>`;}).join('');
    document.querySelector('.wrap').append(seaLayer);
    const stationHints=[['부산','기장','울산'],['부산','기장'],['기장','울산','부산'],['부산','가덕','거제'],['기장','울산','부산'],['기장','울산'],['부산','가덕','거제']];
    function kmaValue(row,...keys){for(const key of keys){if(row[key]&&row[key]!=='-')return row[key];}return null;}
    async function loadLive(index){
      try{
        const data=await fetch('./data/kma-marine.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('KMA data unavailable');return r.json();});
        const hints=stationHints[index];
        const row=data.rows.find(item=>hints.some(hint=>String(kmaValue(item,'STN_KO','STN')||'').includes(hint)))||data.rows[0];
        const b=beaches[index];
        const wave=Number(kmaValue(row,'WH','WH_SIG')),period=Number(kmaValue(row,'WP')),temp=Number(kmaValue(row,'TW')),wind=Number(kmaValue(row,'WS','WS1')),direction=kmaValue(row,'WD','WD1');
        if(Number.isFinite(wave))b.wave=wave;if(Number.isFinite(period))b.period=period;if(Number.isFinite(temp))b.temp=temp;if(Number.isFinite(wind))b.wind=wind;if(direction)b.windDir=`${direction}°`;
        const time=kmaValue(row,'TM')||new Date(data.fetchedAt).toLocaleString('ko-KR');
        const station=kmaValue(row,'STN_KO','STN')||'해양관측소';
        liveNotice.textContent=`기상청 ${station} 관측값 · ${time} 기준 · 약 15분마다 자동 갱신`;
        render();renderBeach();
      }catch{liveNotice.textContent='기상청 최신 관측자료가 아직 준비되지 않아 기본 정보를 표시합니다.';}
    }
    let kakaoMapToken=0;
    let currentKakaoPlace=null;
    let fullKakaoMap=null;
    let fullKakaoMarker=null;
    function mapSdkReady(callback,attempt=0){
      if(window.kakao&&window.kakao.maps){window.kakao.maps.load(callback);}
      else if(attempt<25){setTimeout(()=>mapSdkReady(callback,attempt+1),180);}
      else{const mini=document.querySelector('#miniMap');if(mini)mini.innerHTML='<div style=\"padding:34px 8px;color:#17636b;font-weight:800;font-size:12px\">카카오 지도 연결을 확인 중이에요</div>';}
    }
    const fixedBeachPlaces={'을왕리해수욕장':{lat:37.4483,lng:126.3720},'대부도해수욕장':{lat:37.1973,lng:126.5840},'하나개해수욕장':{lat:37.3840,lng:126.4110}};
    function beachPlaceSearch(beach,callback){
      const fixed=fixedBeachPlaces[beach.name];
      if(fixed){callback({name:beach.name,lat:fixed.lat,lng:fixed.lng});return;}
      mapSdkReady(()=>{
        const places=new kakao.maps.services.Places();
        const query=`${beach.area||'부산'} ${beach.name}`;
        places.keywordSearch(query,(data,status)=>{
          if(status===kakao.maps.services.Status.OK&&data[0]) callback({name:beach.name,lat:Number(data[0].y),lng:Number(data[0].x)});
          else callback({name:beach.name,lat:35.1587,lng:129.1604});
        });
      });
    }
    function setRouteLink(place,origin){
      const route=document.querySelector('#kakaoRoute');
      const destination=`${encodeURIComponent(place.name)},${place.lat},${place.lng}`;
      route.href=origin ? `https://map.kakao.com/link/from/현재위치,${origin.lat},${origin.lng}/to/${destination}` : `https://map.kakao.com/link/to/${destination}`;
    }
    function renderKakaoMap(beach){
      const token=++kakaoMapToken;
      const mini=document.querySelector('#miniMap');
      if(!mini) return;
      mini.innerHTML='<div style="padding:42px 8px;color:#17636b;font-weight:800;font-size:12px">지도 불러오는 중…</div>';
      beachPlaceSearch(beach,place=>{
        if(token!==kakaoMapToken) return;
        currentKakaoPlace=place;
        mapSdkReady(()=>{
          if(token!==kakaoMapToken) return;
          mini.innerHTML='';
          const position=new kakao.maps.LatLng(place.lat,place.lng);
          const miniMap=new kakao.maps.Map(mini,{center:position,level:4,draggable:false,scrollwheel:false,disableDoubleClick:true});
          new kakao.maps.Marker({position,title:place.name,map:miniMap});
          setRouteLink(place);
          mini.onclick=()=>openMapModal(place);
        });
      });
    }
    function openMapModal(place){
      const modal=document.querySelector('#mapModal');
      const full=document.querySelector('#fullMap');
      modal.classList.remove('hidden');modal.setAttribute('aria-hidden','false');
      full.innerHTML='';
      mapSdkReady(()=>{
        const position=new kakao.maps.LatLng(place.lat,place.lng);
        fullKakaoMap=new kakao.maps.Map(full,{center:position,level:4});
        fullKakaoMarker=new kakao.maps.Marker({position,title:place.name,map:fullKakaoMap});
        document.querySelector('#mapTitle').textContent=place.name+' 지도';
        document.querySelector('#routeStatus').textContent='내 위치를 표시한 뒤 카카오맵 길찾기를 누르면 교통 반영 경로와 시간을 확인할 수 있어요.';
      });
    }
    document.querySelector('#closeMap').addEventListener('click',()=>{document.querySelector('#mapModal').classList.add('hidden');document.querySelector('#mapModal').setAttribute('aria-hidden','true');});
    document.querySelector('#mapModal').addEventListener('click',e=>{if(e.target.id==='mapModal')document.querySelector('#closeMap').click();});
    document.querySelector('#showMyLocation').addEventListener('click',()=>{
      if(!currentKakaoPlace||!navigator.geolocation){document.querySelector('#routeStatus').textContent='이 기기에서는 현재 위치를 사용할 수 없어요.';return;}
      document.querySelector('#routeStatus').textContent='현재 위치를 확인하고 있어요…';
      navigator.geolocation.getCurrentPosition(position=>{
        const origin={lat:position.coords.latitude,lng:position.coords.longitude};
        const point=new kakao.maps.LatLng(origin.lat,origin.lng);
        new kakao.maps.Marker({position:point,title:'내 위치',map:fullKakaoMap});
        setRouteLink(currentKakaoPlace,origin);
        document.querySelector('#routeStatus').textContent='내 위치를 표시했어요. 카카오맵 길찾기에서 실제 경로와 예상 시간을 확인하세요.';
      },()=>{document.querySelector('#routeStatus').textContent='위치 권한이 필요해요. 브라우저에서 위치 권한을 허용한 뒤 다시 눌러 주세요.';},{enableHighAccuracy:true,timeout:10000});
    });
    let kakaoDetailToken=0;
    function renderDetailKakaoMap(beach){
      const token=++kakaoDetailToken;
      const detail=document.querySelector('#detailMap');
      if(!detail) return;
      detail.innerHTML='<div style="padding:72px 8px;color:#17636b;font-weight:800;font-size:12px">지도 불러오는 중…</div>';
      beachPlaceSearch(beach,place=>{
        if(token!==kakaoDetailToken) return;
        mapSdkReady(()=>{
          if(token!==kakaoDetailToken) return;
          detail.innerHTML='';
          const position=new kakao.maps.LatLng(place.lat,place.lng);
          const detailMap=new kakao.maps.Map(detail,{center:position,level:4,draggable:false,scrollwheel:false,disableDoubleClick:true});
          new kakao.maps.Marker({position,title:place.name,map:detailMap});
          const detailButton=document.querySelector('#detailMapButton');
          if(detailButton) detailButton.onclick=()=>openMapModal(place);
        });
      });
    }
    function render(){
      document.querySelector('#chips').innerHTML=activities.map((a,i)=>`<button class="${i===selected?'active':''}" data-index="${i}">${a}</button>`).join('');
      const ranked=[...beaches].sort((a,b)=>b.scores[selected]-a.scores[selected]);
      const best=ranked[0];
      const picked=chosenBeachName ? beaches.find(b=>b.name===chosenBeachName) : null;
      const topBeach=picked||best;
      document.querySelector('#recommendLabel').textContent=picked ? '선택한 해수욕장' : `${activities[selected]} 추천 1위`;
      document.querySelector('#recommendName').textContent=topBeach.name;
      document.querySelector('#recommendInfo').textContent=picked ? `파고 ${topBeach.wave}m · 수온 ${topBeach.temp}°C · ${activities[selected]} 활동 순위 ${ranked.findIndex(b=>b.name===topBeach.name)+1}위` : `파고 ${best.wave}m · 수온 ${best.temp}°C · 수질 좋음`;
      renderKakaoMap(topBeach);
      document.querySelector('#list').innerHTML=ranked.map((b,i)=>{
        const isPicked=b.name===chosenBeachName;
        return `<article class="card pickable ${isPicked?'selected-card':''}" data-recommend-beach="${b.name}" tabindex="0" role="button" aria-label="${b.name} 선택"><img class="beach-photo" src="${b.photo}" alt="${b.name} 전경" loading="lazy"><div class="card-content"><div><span class="rank">${i+1}</span><b>${b.name}</b>${isPicked?'<span class="selected-badge">선택한 해변</span>':''}</div><div class="meta">파고 ${b.wave}m · 수온 ${b.temp}°C<br>수질 좋음 · 해파리 관찰 없음 · 활동 순위 ${i+1}위</div><div class="photo-credit">사진: Wikimedia Commons</div></div></article>`;
      }).join('');
      document.querySelectorAll('#chips button').forEach(button=>button.addEventListener('click',()=>{selected=Number(button.dataset.index);chosenBeachName=null;render();}));
      document.querySelectorAll('[data-recommend-beach]').forEach(card=>card.addEventListener('click',()=>{chosenBeachName=card.dataset.recommendBeach;render();}));
    }
    function renderBeach(){
      document.querySelector('#beachPicker').innerHTML=beaches.map((b,i)=>`<button class="${i===selectedBeach?'active':''}" data-beach="${i}">${b.name.replace('해수욕장','')}</button>`).join('');
      const b=beaches[selectedBeach];
      const available=activities.filter((_,i)=>b.scores[i]>=80);
      document.querySelector('#beachDetail').innerHTML=`<article class="beach-detail"><img class="detail-hero" src="${b.photo}" alt="${b.name} 전경"><div class="detail-body"><h2>${b.name}</h2><div class="info-grid"><div class="info-item"><small>파고</small><b>${b.wave}m</b></div><div class="info-item"><small>파주기</small><b>${b.period}초</b></div><div class="info-item"><small>수온</small><b>${b.temp}°C</b></div><div class="info-item"><small>풍속</small><b>${b.wind}m/s</b></div><div class="info-item"><small>풍향</small><b>${b.windDir}</b></div><div class="info-item"><small>물때</small><b>${b.tide}</b></div><div class="info-item"><small>수질</small><b>${b.water}</b></div><div class="info-item"><small>해파리</small><b>${b.jelly}</b></div><div class="info-item"><small>모래 온도</small><b>${b.sand}°C</b></div></div><h3>이 바다에서 즐기기 좋은 활동</h3><div class="activity-tags">${available.map(a=>`<span class="activity-tag">${a}</span>`).join('')}</div><button id="detailMapButton" class="detail-map-preview" type="button" aria-label="선택 해수욕장 지도 크게 보기"><div id="detailMap"></div><span>지도를 크게 보기</span></button><div class="photo-credit">사진: Wikimedia Commons</div></div></article>`;
      renderDetailKakaoMap(b);
      document.querySelectorAll('[data-beach]').forEach(button=>button.addEventListener('click',()=>{selectedBeach=Number(button.dataset.beach);renderBeach();loadLive(selectedBeach);}));
    }
    document.querySelector('#activityTab').addEventListener('click',()=>{document.querySelector('#activityMode').classList.remove('hidden');document.querySelector('#beachMode').classList.add('hidden');document.querySelector('#activityTab').classList.add('active');document.querySelector('#beachTab').classList.remove('active');});
    document.querySelector('#beachTab').addEventListener('click',()=>{document.querySelector('#activityMode').classList.add('hidden');document.querySelector('#beachMode').classList.remove('hidden');document.querySelector('#activityTab').classList.remove('active');document.querySelector('#beachTab').classList.add('active');renderBeach();});
    refreshButton.addEventListener('click',()=>loadLive(selectedBeach));
    render();
    renderBeach();
    loadLive(selectedBeach);
    setInterval(()=>loadLive(selectedBeach),10*60*1000);
  
    const regionalBeaches={
      '부산':beaches.map(b=>({...b})),
      '강원':[['경포','강릉',.7,22.1,6.2,4.0],['속초','속초',.8,21.7,6.8,4.5],['망상','동해',.9,21.5,6.9,4.7]],
      '경기·인천':[ ['을왕리','인천',.4,23.0,4.5,3.0],['대부도','안산',.3,23.2,4.1,2.8],['하나개','무의도',.5,22.8,5.0,3.4]],
      '충남':[ ['대천','보령',.5,23.5,5.0,3.5],['꽃지','태안',.6,23.1,5.6,4.0],['만리포','태안',.8,22.9,6.1,4.4]],
      '전북':[ ['변산','부안',.5,23.7,5.2,3.3],['선유도','군산',.4,23.9,4.8,3.0]],
      '전남':[ ['대광','신안',.6,24.1,5.5,3.6],['명사십리','완도',.5,24.3,5.0,3.2],['율포','보성',.4,24.4,4.7,2.9]],
      '경북':[ ['영일대','포항',.5,23.4,5.1,3.5],['월포','포항',.7,23.0,6.0,4.1],['나정','경주',.6,22.8,5.7,3.8]],
      '제주':[ ['협재','제주',.5,25.0,5.3,3.5],['함덕','제주',.6,24.8,5.8,3.9],['중문','서귀포',.9,24.9,6.5,4.6]]
    };
    Object.keys(regionalBeaches).filter(r=>r!=='부산').forEach(region=>{regionalBeaches[region]=regionalBeaches[region].map((d,i)=>({name:d[0]+'해수욕장',wave:d[2],temp:d[3],period:d[4],wind:d[5],windDir:'남동',tide:'물때 확인',water:'관측 정보 확인',jelly:'관측 정보 확인',sand:28,scores:[85-i*3,72+i*3,75,68,82,84,86],photo:'https://commons.wikimedia.org/wiki/Special:FilePath/Busan%20City%20Haeundae%20Beach%20KOGL%20(01).jpg?width=700',area:region}));});
    let selectedRegion='부산';
    const regionPanel=document.createElement('section');
    regionPanel.className='region-panel';
    regionPanel.innerHTML='<h3>어느 지역 바다를 볼까?</h3><div class="region-chips"></div>';
    document.querySelector('.wrap').insertBefore(regionPanel,document.querySelector('.mode-tabs'));
    function renderRegions(){document.querySelector('.region-chips').innerHTML=Object.keys(regionalBeaches).map(r=>'<button class="'+(r===selectedRegion?'active':'')+'" data-region="'+r+'">'+r+'</button>').join('');document.querySelectorAll('[data-region]').forEach(btn=>btn.addEventListener('click',()=>{selectedRegion=btn.dataset.region;beaches.splice(0,beaches.length,...regionalBeaches[selectedRegion].map(b=>({...b})));selectedBeach=0;renderRegions();render();renderBeach();}));}
    renderRegions();

  
    const commonsPhotos={'경포해수욕장':'https://upload.wikimedia.org/wikipedia/commons/b/b9/Gyeongpo_Beach_1.jpg','속초해수욕장':'https://upload.wikimedia.org/wikipedia/commons/e/e9/Sokcho_Beach_20221209_003.jpg','망상해수욕장':'https://upload.wikimedia.org/wikipedia/commons/a/ad/Gwan_02.jpg','을왕리해수욕장':'https://upload.wikimedia.org/wikipedia/commons/1/12/Eulwangri_Beach%2C_near_Incheon_Airport.jpg','대부도해수욕장':'https://upload.wikimedia.org/wikipedia/commons/d/df/Daebudo_summer_2016_39.JPG','대천해수욕장':'https://upload.wikimedia.org/wikipedia/commons/c/c6/Daecheon_Beach%2C_Korea.jpg','변산해수욕장':'https://upload.wikimedia.org/wikipedia/commons/2/26/Byeonsan_Sea_Beach.jpg','협재해수욕장':'https://upload.wikimedia.org/wikipedia/commons/a/af/Dol_Hareubang_at_Hyeopjae_Beach.jpg','중문해수욕장':'https://upload.wikimedia.org/wikipedia/commons/f/f7/Beach_at_Jungmun_Tourism_Complex.jpg','송도해수욕장':'https://upload.wikimedia.org/wikipedia/commons/b/ba/Busan_-_Songdo_beach.jpg'};
    Object.values(regionalBeaches).flat().forEach(b=>{if(commonsPhotos[b.name])b.photo=commonsPhotos[b.name];});

  
    const regionalFallbackPhotos={'하나개해수욕장':'https://upload.wikimedia.org/wikipedia/commons/1/12/Eulwangri_Beach%2C_near_Incheon_Airport.jpg','꽃지해수욕장':'https://upload.wikimedia.org/wikipedia/commons/c/c6/Daecheon_Beach%2C_Korea.jpg','만리포해수욕장':'https://upload.wikimedia.org/wikipedia/commons/c/c6/Daecheon_Beach%2C_Korea.jpg','선유도해수욕장':'https://upload.wikimedia.org/wikipedia/commons/2/26/Byeonsan_Sea_Beach.jpg','대광해수욕장':'https://upload.wikimedia.org/wikipedia/commons/2/26/Byeonsan_Sea_Beach.jpg','명사십리해수욕장':'https://upload.wikimedia.org/wikipedia/commons/f/f7/Beach_at_Jungmun_Tourism_Complex.jpg','율포해수욕장':'https://upload.wikimedia.org/wikipedia/commons/f/f7/Beach_at_Jungmun_Tourism_Complex.jpg','영일대해수욕장':'https://upload.wikimedia.org/wikipedia/commons/e/e9/Sokcho_Beach_20221209_003.jpg','월포해수욕장':'https://upload.wikimedia.org/wikipedia/commons/e/e9/Sokcho_Beach_20221209_003.jpg','나정해수욕장':'https://upload.wikimedia.org/wikipedia/commons/b/b9/Gyeongpo_Beach_1.jpg','함덕해수욕장':'https://upload.wikimedia.org/wikipedia/commons/b/bc/%ED%95%A8%EB%8D%95_%EC%84%9C%EC%9A%B0%EB%B4%89_%ED%95%B4%EC%88%98%EC%9A%95%EC%9E%A5.jpg'};
    Object.values(regionalBeaches).flat().forEach(b=>{if(regionalFallbackPhotos[b.name])b.photo=regionalFallbackPhotos[b.name];});

  Object.values(regionalBeaches).flat().forEach(b=>{if(b.name==='하나개해수욕장')b.photo='https://upload.wikimedia.org/wikipedia/commons/5/5e/Cabana_at_Hanagae_Beach%2C_Muuido.jpg';if(b.name==='꽃지해수욕장')b.photo='https://upload.wikimedia.org/wikipedia/commons/b/b9/Kkotji_Beach_in_Buan.jpg';});const userPhotos={'을왕리해수욕장':'1','하나개해수욕장':'2','대천해수욕장':'3','꽃지해수욕장':'4','만리포해수욕장':'5','변산해수욕장':'6','선유도해수욕장':'7','명사십리해수욕장':'8','율포해수욕장':'9','영일대해수욕장':'10'};Object.values(regionalBeaches).flat().forEach(b=>{if(userPhotos[b.name])b.photo='https://raw.githubusercontent.com/leejoonie09-art/busan_beach/main/'+userPhotos[b.name];});</script>
</body>
</html>
